# Snyk Code (SAST) for this repository. Results are uploaded to GitHub
# code scanning. Open Source, IaC, and Container steps from the Snyk
# sample workflow are omitted: this repo has no Dockerfile or IaC
# files, and the Snyk CLI does not treat pyproject.toml/uv.lock as a
# supported manifest unless the org has the uv feature enabled.

name: Snyk Security

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif
      actions: read # required for upload-sarif on a private repository
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce

      - name: Check SNYK_TOKEN
        run: |
          if [ -z "${SNYK_TOKEN}" ]; then
            echo "GitHub secret SNYK_TOKEN is empty."
            exit 1
          fi

      - name: Snyk Code test
        run: |
          set +e
          snyk code test --sarif-file-output=snyk-code.sarif
          status=$?
          set -e
          # Exit 1 means issues were found and the SARIF file was written.
          if [ "$status" -eq 1 ]; then
            exit 0
          fi
          exit "$status"

      - name: Upload result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
