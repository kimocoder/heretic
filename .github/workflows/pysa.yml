name: Pysa

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '28 0 * * 3'

permissions:
  contents: read

jobs:
  pysa:
    name: Pysa Static Analysis
    permissions:
      actions: read
      contents: read
      security-events: write

    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --python 3.10 --all-extras --dev

      - name: Prepare SAPP filters
        run: |
          mkdir -p tmp/sapp_filters
          cat << 'EOF' > tmp/sapp_filters/empty_filter.json
          {
            "name": "Pass through filter",
            "description": "Shows all issues",
            "paths": ["%"]
          }
          EOF

      - name: Run Pysa taint analysis
        run: |
          mkdir -p pysa-output
          uv run --python 3.10 --with pyre-check pyre analyze --no-verify --save-results-to=./pysa-output || true

      - name: Post-process results with SAPP
        run: |
          if [ -f pysa-output/taint-metadata.json ]; then
            uv run --python 3.10 --with fb-sapp sapp update warning-codes ./pysa-output/taint-metadata.json || true
            uv run --python 3.10 --with fb-sapp sapp analyze ./pysa-output || true
            uv run --python 3.10 --with fb-sapp sapp filter issues 1 tmp/sapp_filters --output-format sarif > pysa-results.sarif || true
          fi
          if [ ! -s pysa-results.sarif ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Pysa","rules":[]}},"results":[]}]}' > pysa-results.sarif
          fi

      - name: Upload Pysa SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pysa-results.sarif
